
          <section class="education tl-section">
            <h2>Education</h2>
            {% if site.education != blank -%}
            <ol class="timeline">
            {%- assign education = site.education | reverse -%}
            {% for item in education limit: site.education_limit %}
              {%- include timeline_item.html item=item -%}
            {% endfor %}
            </ol>
            {%- else -%}
            <p>No education so far...</p>
            {%- endif %}
          </section>
