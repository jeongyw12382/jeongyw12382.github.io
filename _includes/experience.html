
          <section class="experience tl-section">
            <h2>Experience</h2>
            {% if site.experience != blank -%}
            <ol class="timeline">
            {%- assign experience = site.experience | reverse -%}
            {% for item in experience %}
              {%- include timeline_item.html item=item -%}
            {% endfor %}
            </ol>
            {%- else -%}
            <p>No experience so far...</p>
            {%- endif %}
          </section>
